<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>國立金門大學 簡易校務選課系統</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;background:#f8fafc;color:#0f172a}h1{color:#1d4ed8}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}button{background:#2563eb;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}button.drop{background:#dc2626}</style></head><body><h1>國立金門大學 校務選課與成績查詢系統</h1><div class="card"><h3>可加選課程清單</h3><table><tr><th>課號</th><th>課程名稱</th><th>學分</th><th>操作</th></tr><tr><td>CS201</td><td>計算機結構</td><td>3</td><td><button onclick="enroll(`CS201`,`計算機結構`,3)">加選</button></td></tr><tr><td>CS202</td><td>軟體工程</td><td>3</td><td><button onclick="enroll(`CS202`,`軟體工程`,3)">加選</button></td></tr><tr><td>CS203</td><td>線性代數</td><td>3</td><td><button onclick="enroll(`CS203`,`線性代數`,3)">加選</button></td></tr></table></div><div class="card"><h3>我的已選課表 (<span id="credits">0</span> 學分)</h3><table id="myTable"><tr><th>課號</th><th>課程名稱</th><th>學分</th><th>操作</th></tr></table></div><script>let list=JSON.parse(localStorage.getItem("nqu_courses")||"[]");function render(){localStorage.setItem("nqu_courses",JSON.stringify(list));const tb=document.getElementById("myTable");tb.innerHTML="<tr><th>課號</th><th>課程名稱</th><th>學分</th><th>操作</th></tr>";let total=0;list.forEach((c,i)=>{total+=c.cr;tb.innerHTML+=`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.cr}</td><td><button class="drop" onclick="drop(${i})">退選</button></td></tr>`});document.getElementById("credits").textContent=total}function enroll(id,name,cr){if(list.some(x=>x.id===id))return alert("已加選過此課程！");list.push({id,name,cr});render()}function drop(i){list.splice(i,1);render()}render()</script></body></html>
